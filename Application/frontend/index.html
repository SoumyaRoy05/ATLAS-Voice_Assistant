<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Local Application</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">ATLAS / LOCAL CONTROL</p>
        <h1>Atlas</h1>
      </div>
      <div id="status" class="status stopped">Stopped</div>
    </header>

    <section class="control-panel" aria-label="Atlas controls">
      <button id="start" type="button">Start Atlas</button>
      <button id="stop" type="button" disabled>Stop Atlas</button>
    </section>

    <section class="log-panel" aria-label="Live terminal output">
      <div class="panel-heading">
        <span>Live terminal output</span>
        <button id="clear" class="secondary" type="button">Clear</button>
      </div>
      <pre id="logs" aria-live="polite"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
